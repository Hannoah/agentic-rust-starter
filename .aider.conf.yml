# NOTE: keep this file ASCII-only. On Windows, aider reads it as cp949 and
# non-ASCII comments make config parsing fail.

# Files injected as read-only context in every session
read:
  - CONVENTIONS.md
  - Cargo.toml
  - docs/ai_context/crate_cheatsheet.md

# Run the compiler/clippy feedback loop right after each edit
auto-lint: true
lint-cmd: "bash ai-verify.sh"  # works on Windows (cmd.exe cannot run ./x.sh), Linux and macOS

# Test command (used by /test)
test-cmd: "cargo test --quiet"
